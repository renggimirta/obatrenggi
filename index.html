<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Obat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; }
        .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .btn-primary:hover { opacity: 0.9; }
        .scanner-container { max-width: 400px; margin: 0 auto; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; }
        .table-responsive { max-height: 400px; overflow-y: auto; }
        .badge-qty { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .empty-state { padding: 40px 20px; text-align: center; color: #999; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark py-3">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-capsule"></i> Scan Obat</span>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Scanner Section -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3"><i class="bi bi-qr-code-scan"></i> Scan Barcode Obat</h5>
                <div class="scanner-container">
                    <div id="reader"></div>
                </div>
                <div class="d-grid gap-2 mt-3">
                    <button class="btn btn-primary btn-lg" id="btnStartScan" onclick="startScanner()">
                        <i class="bi bi-camera"></i> Mulai Scan
                    </button>
                    <button class="btn btn-danger btn-lg d-none" id="btnStopScan" onclick="stopScanner()">
                        <i class="bi bi-stop-circle"></i> Stop Scan
                    </button>
                </div>
            </div>
        </div>

        <!-- Manual Add Section -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3"><i class="bi bi-plus-circle"></i> Tambah Manual</h5>
                <div class="row g-2">
                    <div class="col-12">
                        <input type="text" class="form-control" id="inputNamaObat" placeholder="Nama Obat">
                    </div>
                    <div class="col-6">
                        <input type="number" class="form-control" id="inputQty" placeholder="Qty" value="1" min="1">
                    </div>
                    <div class="col-6">
                        <button class="btn btn-primary w-100 h-100" onclick="addObat()">
                            <i class="bi bi-save"></i> Simpan
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Table Section -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0"><i class="bi bi-list-ul"></i> Data Obat</h5>
                    <div class="input-group" style="max-width: 200px;">
                        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Cari..." onkeyup="searchObat()">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover" id="tableObat">
                        <thead class="table-light sticky-top">
                            <tr>
                                <th>No</th>
                                <th>Nama Obat</th>
                                <th>Qty</th>
                                <th>Tanggal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyObat">
                        </tbody>
                    </table>
                    <div class="empty-state d-none" id="emptyState">
                        <i class="bi bi-inbox" style="font-size: 48px;"></i>
                        <p class="mt-2">Belum ada data obat</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3"><i class="bi bi-gear"></i> Fitur</h5>
                <div class="d-grid gap-2">
                    <a href="/api/export" class="btn btn-success">
                        <i class="bi bi-file-earmark-excel"></i> Export Excel
                    </a>
                    <button class="btn btn-info text-white" data-bs-toggle="modal" data-bs-target="#importModal">
                        <i class="bi bi-upload"></i> Import Excel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px;">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil"></i> Edit Obat</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label">Nama Obat</label>
                        <input type="text" class="form-control" id="editNamaObat">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Qty</label>
                        <input type="number" class="form-control" id="editQty" min="1">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" onclick="updateObat()">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal fade" id="importModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px;">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-upload"></i> Import Excel</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="file" class="form-control" id="fileImport" accept=".xlsx,.xls">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" onclick="importExcel()">Import</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Unknown Obat Modal -->
    <div class="modal fade" id="unknownModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px;">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-question-circle"></i> Obat Belum Dikenal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Nama obat belum ada di database.</p>
                    <div class="mb-3">
                        <label class="form-label">Nama Obat</label>
                        <input type="text" class="form-control" id="unknownNamaObat">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Qty</label>
                        <input type="number" class="form-control" id="unknownQty" value="1" min="1">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" onclick="saveUnknownObat()">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container">
        <div id="toast" class="toast align-items-center text-white border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let html5QrCode;
        let scannerRunning = false;
        let allData = [];

        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadObat();
        });

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastBody = document.getElementById('toastBody');
            toast.className = `toast align-items-center text-white border-0 bg-${type}`;
            toastBody.textContent = message;
            new bootstrap.Toast(toast).show();
        }

        // Scanner
        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                onScanSuccess,
                onScanFailure
            ).then(() => {
                scannerRunning = true;
                document.getElementById('btnStartScan').classList.add('d-none');
                document.getElementById('btnStopScan').classList.remove('d-none');
            }).catch(err => {
                showToast('Gagal mengakses kamera: ' + err, 'danger');
            });
        }

        function stopScanner() {
            if (html5QrCode && scannerRunning) {
                html5QrCode.stop().then(() => {
                    scannerRunning = false;
                    document.getElementById('btnStartScan').classList.remove('d-none');
                    document.getElementById('btnStopScan').classList.add('d-none');
                });
            }
        }

        function onScanSuccess(decodedText) {
            stopScanner();
            checkObat(decodedText);
        }

        function onScanFailure(error) {
            // Ignore scan failures
        }

        function checkObat(namaObat) {
            fetch('/api/obat')
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        const existing = result.data.find(o => o.nama_obat.toLowerCase() === namaObat.toLowerCase());
                        if (existing) {
                            // Obat exists, add quantity
                            addObatDirect(namaObat, 1);
                        } else {
                            // Unknown obat, show modal
                            document.getElementById('unknownNamaObat').value = namaObat;
                            new bootstrap.Modal(document.getElementById('unknownModal')).show();
                        }
                    }
                });
        }

        function saveUnknownObat() {
            const nama = document.getElementById('unknownNamaObat').value;
            const qty = parseInt(document.getElementById('unknownQty').value) || 1;
            bootstrap.Modal.getInstance(document.getElementById('unknownModal')).hide();
            addObatDirect(nama, qty);
        }

        // CRUD
        function loadObat() {
            fetch('/api/obat')
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        allData = result.data;
                        renderTable(allData);
                    }
                });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tbodyObat');
            const empty = document.getElementById('emptyState');
            
            if (data.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('d-none');
                return;
            }
            
            empty.classList.add('d-none');
            tbody.innerHTML = data.map((item, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${item.nama_obat}</td>
                    <td><span class="badge badge-qty">${item.qty}</span></td>
                    <td>${formatDate(item.tanggal)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editObat(${item.id}, '${item.nama_obat}', ${item.qty})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteObat(${item.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function addObat() {
            const nama = document.getElementById('inputNamaObat').value.trim();
            const qty = parseInt(document.getElementById('inputQty').value) || 1;
            
            if (!nama) {
                showToast('Nama obat harus diisi!', 'danger');
                return;
            }
            
            addObatDirect(nama, qty);
            document.getElementById('inputNamaObat').value = '';
            document.getElementById('inputQty').value = '1';
        }

        function addObatDirect(nama, qty) {
            fetch('/api/obat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama_obat: nama, qty: qty })
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    showToast(result.message || 'Obat berhasil ditambahkan');
                    loadObat();
                } else {
                    showToast(result.error || 'Gagal menambahkan obat', 'danger');
                }
            });
        }

        function editObat(id, nama, qty) {
            document.getElementById('editId').value = id;
            document.getElementById('editNamaObat').value = nama;
            document.getElementById('editQty').value = qty;
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        function updateObat() {
            const id = document.getElementById('editId').value;
            const nama = document.getElementById('editNamaObat').value.trim();
            const qty = parseInt(document.getElementById('editQty').value) || 1;
            
            if (!nama) {
                showToast('Nama obat harus diisi!', 'danger');
                return;
            }
            
            fetch(`/api/obat/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama_obat: nama, qty: qty })
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    showToast('Obat berhasil diupdate');
                    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                    loadObat();
                } else {
                    showToast(result.error || 'Gagal mengupdate obat', 'danger');
                }
            });
        }

        function deleteObat(id) {
            if (!confirm('Yakin ingin menghapus data ini?')) return;
            
            fetch(`/api/obat/${id}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    showToast('Obat berhasil dihapus');
                    loadObat();
                } else {
                    showToast(result.error || 'Gagal menghapus obat', 'danger');
                }
            });
        }

        function searchObat() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allData.filter(item => 
                item.nama_obat.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        function importExcel() {
            const fileInput = document.getElementById('fileImport');
            const file = fileInput.files[0];
            
            if (!file) {
                showToast('Pilih file Excel terlebih dahulu!', 'danger');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            fetch('/api/import', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    showToast(result.message || 'Import berhasil');
                    bootstrap.Modal.getInstance(document.getElementById('importModal')).hide();
                    fileInput.value = '';
                    loadObat();
                } else {
                    showToast(result.error || 'Gagal import data', 'danger');
                }
            });
        }
    </script>
</body>
</html>
